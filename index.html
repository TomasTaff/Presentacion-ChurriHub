<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChurriHub Presentación Final</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Concepto: escenario de presentación a pantalla completa, un tema por lámina, datos vivos para tocar. Paleta de marca Tu Churrito. */
:root{
  --bg:#FAF1EB; --surface:#FFF8F2; --ink:#3B2418; --muted:#7A6659; --line:#E8D5C8;
  --accent:#F6603A; --accent-ink:#B8381A; --on-accent:#3B2418; --soft:#FEE3CF;
  --ok:#2E7D5B; --bad:#B8392B; --warn:#9A6700;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);flex:none}
.top img{width:34px;height:34px;object-fit:contain}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font:500 12px var(--f-body);color:var(--muted);letter-spacing:.02em}
.sp{flex:1}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-family:var(--f-mono)}
.pill.run{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stage{flex:1;min-height:0;position:relative}
.slide{position:absolute;inset:0;overflow-y:auto;padding-block:22px 18px;display:none}
.slide.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px}
.meta{display:flex;flex-direction:column;gap:10px;align-self:start}
.kick{font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.who{display:flex;align-items:center;gap:8px;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 13px var(--f-display);flex:none}
.min{font:500 12px var(--f-mono);color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.08}
h2{font-size:clamp(28px,3.6vw,46px);font-weight:800}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.lead{font-size:18px;color:var(--muted);max-width:62ch;margin:10px 0 0}
.body{display:flex;flex-direction:column;gap:18px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.hl{background:var(--soft);border-color:transparent}
.big{font:800 clamp(30px,3.4vw,44px) var(--f-display);letter-spacing:-.03em;line-height:1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lab{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-block}
.btn[aria-pressed="true"],.btn.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
.tag{display:inline-block;font:600 12px var(--f-body);padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accent-ink)}
.tag.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.tag.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px;max-width:80ch}
.bar{height:12px;border-radius:3px;background:var(--accent);min-width:2px}
.bar.g{background:var(--line)}
.bars{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:14px}
.bars .t{background:var(--line);border-radius:3px;height:12px;position:relative}
.bars .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font:500 13px var(--f-mono);min-width:44px;text-align:center}
.chip.pass{border-color:var(--ok);color:var(--ok)}
.chip.fail{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.chip.none{border-style:dashed;color:var(--muted)}
.chip[aria-pressed="true"]{outline:3px solid var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
svg text{fill:var(--muted);font:12px var(--f-body)}
svg .ax{stroke:var(--line);stroke-width:1}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow>div{flex:1 1 130px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;position:relative}
.flow>div b{display:block;font-family:var(--f-display)}
.nav{display:flex;align-items:center;gap:12px;padding-block:10px;border-top:1px solid var(--line);flex:none;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
.dots button{width:12px;height:12px;border-radius:50%;border:1px solid var(--muted);background:transparent;padding:0}
.dots button[aria-current="true"]{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.cover{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:36px;align-items:center;min-height:100%}
.cover h1{font-size:clamp(46px,9vw,112px);font-weight:800;line-height:.95}
.cover h1 span{color:var(--accent)}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.team button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.team button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.cell{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-height:76px;padding:6px}
@media (max-width:760px){
  .wrap,.cover{grid-template-columns:minmax(0,1fr);gap:14px}
  .meta{flex-direction:row;flex-wrap:wrap;align-items:center}
  .pill.hide{display:none}
  .bars{grid-template-columns:minmax(0,1fr) auto}.bars .t{grid-column:1/-1;order:3}
}
</style><style>
.dhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.file{font:500 12px var(--f-mono);color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:3px 8px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px}
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.idx button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.idx button:hover{border-color:var(--accent)}
.idx .n{font:500 12px var(--f-mono);color:var(--accent-ink)}
.idx b{font-family:var(--f-display);font-size:16px}
.phase{font:600 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px}
details{border-left:2px solid var(--line);padding-left:12px;margin:4px 0}
details>summary{cursor:pointer;font-weight:600;padding:3px 0}
details[open]>summary{color:var(--accent-ink)}
.leaf{font-size:14px;color:var(--muted);padding:2px 0 2px 14px}
.raci{display:inline-grid;place-items:center;width:30px;height:26px;border-radius:5px;font:700 13px var(--f-mono)}
.raci.R{background:var(--accent);color:var(--on-accent)}.raci.A{background:var(--ink);color:var(--surface)}
.raci.C{border:1px solid var(--accent-ink);color:var(--accent-ink)}.raci.I{color:var(--muted)}
tr.sel td{background:var(--soft)}
.dep{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.dep button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.dep button.in{border-color:var(--ok);color:var(--ok)}.dep button.out{border-color:var(--accent);color:var(--accent-ink)}
.dep button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
[hidden]{display:none!important}
/* ---------- animaciones ---------- */
.prog{position:absolute;left:0;top:0;height:3px;background:var(--accent);width:0;transition:width .45s cubic-bezier(.2,.7,.2,1);z-index:2;border-radius:0 2px 2px 0}
.slide.on.fwd{animation:inR .45s cubic-bezier(.2,.7,.2,1)}
.slide.on.back{animation:inL .45s cubic-bezier(.2,.7,.2,1)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide.stg .body>*,.slide.stg .cover>.grid>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms + 80ms)}
.slide.stg .cover h1{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards .05s}
.slide.stg .cover h1 span{display:inline-block;animation:pop .6s cubic-bezier(.3,1.5,.5,1) backwards .35s}
.slide.stg .bars .t i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) backwards .35s}
.slide.stg svg rect[data-c],.slide.stg svg rect[data-b]{transform-box:fill-box;animation:growY .7s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--j,0)*35ms + 250ms)}
.slide.stg svg rect[data-b]{transform-origin:left;animation-name:grow}
.slide.stg svg rect[data-c]{transform-origin:bottom}
.slide.stg .chips>*,.slide.stg .cell>*{animation:pop .35s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:calc(var(--j,0)*18ms + 300ms)}
.fade,.slide.stg .body>[data-pane].fade{animation:fade .3s ease;animation-delay:0s}
path.draw{transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)}
.card,.idx button,.team button,.dep button,.btn,.chip{transition:transform .18s ease,background-color .2s ease,border-color .2s ease,box-shadow .18s ease}
.idx button:hover,.team button:hover,.dep button:hover{transform:translateY(-2px)}
.btn:hover{transform:translateY(-1px)}
.btn:active,.chip:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---------- lectura a distancia ---------- */
body{font-size:20px;line-height:1.45}
.wrap{max-width:1320px}
.top img{width:42px;height:42px}
.brand{font-size:22px}.brand small{font-size:14px}
.pill{font-size:16px;padding:8px 14px}
.kick{font-size:15px}
.file{font-size:14px;overflow-wrap:anywhere;max-width:100%}
h2{font-size:clamp(32px,4.2vw,58px)}
h3{font-size:23px}
.lead{font-size:23px}
.lab{font-size:17px}
.big{font-size:clamp(36px,4vw,56px)}
.btn{font-size:18px;padding:10px 16px}
.tag{font-size:16px;padding:3px 12px}
.chip{font-size:17px;padding:8px 11px;min-width:52px}
table{font-size:18px}th{font-size:15px}th,td{padding:10px 12px}
.flow>div{font-size:18px;padding:12px 14px}
.note{font-size:18px}
.bars{font-size:18px;grid-template-columns:minmax(130px,210px) minmax(0,1fr) auto}
.bars .t{height:16px}
.idx{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.idx b{font-size:20px}.idx .n{font-size:14px}.idx .lab{font-size:16px}
.grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.team{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.av{width:38px;height:38px;font-size:15px}
svg text{font-size:15px}
.raci{width:40px;height:34px;font-size:17px}
details>summary{font-size:20px}.leaf{font-size:18px}
.dep{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.dep button{font-size:18px;padding:10px 12px}
.nav .btn{font-size:17px}
.dots button{width:14px;height:14px}
.cover h1{font-size:clamp(56px,10vw,132px)}
.ptiles{grid-template-columns:repeat(3,minmax(0,1fr))}.ptiles .big{font-size:clamp(28px,2.5vw,38px)}.ptiles .card{padding:14px}
@media (max-width:760px){body{font-size:17px}.lead{font-size:19px}.lab{font-size:15px}.btn{font-size:16px}table{font-size:16px}.grid{grid-template-columns:minmax(0,1fr)}.idx{grid-template-columns:minmax(0,1fr)}.ptiles{grid-template-columns:minmax(0,1fr)}.bars{grid-template-columns:minmax(0,1fr) auto}}
</style>
</head>

 ${CARGAS.m.map((m,i)=>{const x=20+i*61;return `<rect data-c="${i}" tabindex="0" x="${x}" y="${150-CARGAS.W[i]/mx*130}" width="24" height="${CARGAS.W[i]/mx*130}" style="fill:var(--accent);cursor:pointer"/><rect data-c="${i}" tabindex="0" x="${x+26}" y="${150-CARGAS.M[i]/mx*130}" width="24" height="${CARGAS.M[i]/mx*130}" style="fill:var(--ink);cursor:pointer"/><text x="${x+25}" y="168" text-anchor="middle">${m}</text>`}).join("")}
 <rect x="440" y="4" width="10" height="10" style="fill:var(--accent)"/><text x="454" y="13">Wilde</text><rect x="510" y="4" width="10" height="10" style="fill:var(--ink)"/><text x="524" y="13">Miramar</text></svg></div>
 <div class="card hl" id="cbox" aria-live="polite"><h3>Tocá un mes</h3><p style="margin:6px 0 0">Wilde ${fmt(tw)} + Miramar ${fmt(tm)} = <b class="mono">${fmt(tw+tm)}</b> ventas, igual a las filas de fact_ventas. Sin duplicados ni ventas sin sucursal.</p></div></div>
 </div><p class="note">Los permisos por rol salen de los casos de prueba 6, 11 y 13. Los datos cargados son de muestra y validan el mecanismo; la ingesta automática desde Lovyverse está pendiente del conector. Las cuentas de demostración están en la pantalla de ingreso.</p>`}});

const DEPS={relevamiento:[],charter:["relevamiento"],enfoque:["relevamiento"],edt:["charter"],cronograma:["edt"],costos:["cronograma","dar"],dar:["riesgos","charter"],interesados:["charter"],raci:["edt","interesados"],comunicaciones:["interesados","raci"],riesgos:["charter","control"],control:["cronograma","costos"],kpis:["charter","testing"],trazabilidad:["charter","testing"],testing:["charter"],prototipo:["testing","enfoque"]};

/* ---------- animación de entrada ---------- */
const RM=matchMedia("(prefers-reduced-motion: reduce)");
function countUp(el){let t=el;while(t.children.length===1)t=t.children[0];if(t.children.length)return;
 const m=t.textContent.match(/^(\D*?)(\d[\d.]*(?:,\d+)?)(.*)$/s);if(!m)return;
 const dec=(m[2].split(",")[1]||"").length,end=parseFloat(m[2].replace(/\./g,"").replace(",",".")),pre=m[1],suf=m[3];if(!isFinite(end)||end===0)return;
 const t0=performance.now(),D=900;const step=now=>{const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);t.textContent=pre+fmt(end*e,dec)+suf;if(p<1)requestAnimationFrame(step);else t.textContent=pre+m[2]+suf};requestAnimationFrame(step)}
function anim(el,dir){el.classList.remove("fwd","back","stg");if(RM.matches)return;void el.offsetWidth;el.classList.add(dir,"stg");
 el.querySelectorAll(".body>*,.cover>.grid>*").forEach((c,k)=>c.style.setProperty("--i",Math.min(k,10)));
 setTimeout(()=>{el.querySelectorAll(".chips,.cell,svg").forEach(g=>[...g.children].forEach((c,k)=>c.style.setProperty("--j",Math.min(k,40))));
  el.querySelectorAll("svg rect[data-c],svg rect[data-b]").forEach((r,k)=>r.style.setProperty("--j",k));
  el.querySelectorAll(".big").forEach(countUp);
  el.querySelectorAll("path.draw").forEach(p=>{const L=p.getTotalLength();p.style.transition="none";p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.transition="";requestAnimationFrame(()=>{p.style.strokeDashoffset=0})})},20)}

const stage=$("#stage"),dots=$("#dots");
const ALL=[{id:"portada",name:"Portada"},{id:"inicio",name:"Índice"},...S,{id:"conexiones",name:"Conexiones y próximos pasos"}];
let cur=0;
function portada(){return `<div class="cover"><div class="body" style="gap:22px"><div class="kick">Presentación final · Dirección de Proyectos de Tecnología</div><h1>Churri<span>Hub</span></h1><p class="lead" style="font-size:22px">Una sola vista de las sucursales de Tu Churrito, sin consolidar a mano los fines de semana.</p><div class="row"><span class="tag">Wilde (piloto)</span><span class="tag">Miramar</span><span class="tag">${S.length} entregables</span></div><div class="row"><button class="btn pri" type="button" data-go="inicio">Ver los entregables →</button><a class="btn" href="https://tomastaff.github.io/ChurriHub-G4/" target="_blank" rel="noopener">Abrir el prototipo ↗</a></div><p class="lab">Grupo 4 · Docente: Ing. Silvina Novoa · Usá ← → para avanzar</p></div>
 <div class="grid ptiles"><div class="card hl" style="grid-column:1/-1"><div class="big">USD 43.274,80</div><div class="lab">presupuesto, contra un tope de USD 43.300</div></div><div class="card"><div class="big">11</div><div class="lab">hitos, del 11/08/2026 al 24/03/2027</div></div><div class="card"><div class="big">34</div><div class="lab">requisitos funcionales con su caso de prueba</div></div><div class="card"><div class="big">34.263</div><div class="lab">ventas de muestra cargadas en el prototipo</div></div></div></div>`}
function cover(){const ph=[...new Set(S.map(s=>s.phase))];
 return `<div class="wrap" style="grid-template-columns:minmax(0,1fr)"><div class="body">
 <div class="row" style="align-items:flex-end;justify-content:space-between"><div><div class="kick">Índice</div><h2 style="font-size:clamp(30px,4vw,50px)">Entregable por entregable</h2>
 <p class="lead">Cada lámina explica un entregable: qué es y qué le sirve a Tu Churrito. Tocá uno para ir directo.</p></div>
 <a class="btn pri" href="https://tomastaff.github.io/ChurriHub-G4/" target="_blank" rel="noopener">Abrir el prototipo ↗</a></div>
 ${ph.map(p=>`<div class="phase">${p}</div><div class="idx">${S.filter(s=>s.phase===p).map(s=>`<button type="button" data-go="${s.id}"><span class="n">${s.file.split(" · ")[0]}</span><b>${s.name}</b><span class="lab">${s.short}</span></button>`).join("")}</div>`).join("")}
 </div></div>`}
function conexiones(){later(()=>{const sh=id=>{const ins=DEPS[id],outs=Object.keys(DEPS).filter(k=>DEPS[k].includes(id));
  $$("[data-dep]").forEach(b=>{const k=b.dataset.dep;b.className=ins.includes(k)?"in":outs.includes(k)?"out":"";b.setAttribute("aria-pressed",k===id)});
  const nm=k=>S.find(s=>s.id===k).name;$("#depbox").innerHTML=`<h3>${nm(id)}</h3><p style="margin:6px 0 0"><b class="ok">Usa:</b> ${ins.map(nm).join(", ")||"es el punto de partida"}<br><b style="color:var(--accent-ink)">Alimenta a:</b> ${outs.map(nm).join(", ")||"es un resultado final"}</p>`};
  $$("[data-dep]").forEach(b=>b.onclick=()=>sh(b.dataset.dep));sh("cronograma")});
 return `<div class="wrap" style="grid-template-columns:minmax(0,1fr)"><div class="body"><div><div class="kick">Integración</div><h2>Los entregables no están sueltos y esto es lo que falta para cerrar</h2>
 <p class="lead">Elegí un entregable y mirá de cuáles sale y a cuáles alimenta.</p></div>
 <div class="dep">${S.map(s=>`<button type="button" data-dep="${s.id}">${s.name}</button>`).join("")}</div><div class="card hl" id="depbox" aria-live="polite"></div>
 <div class="grid"><div class="card"><span class="tag ok">Hecho</span><p style="margin:8px 0 0">Plan completo: Charter, EDT, cronograma, interesados, roles, comunicaciones, riesgos, decisiones, costos y control.</p></div><div class="card"><span class="tag ok">Hecho</span><p style="margin:8px 0 0">Prototipo en línea con los siete módulos y datos de muestra cargados.</p></div><div class="card"><span class="tag warn">Pendiente</span><p style="margin:8px 0 0">Aprobación del tope de USD 43.300 y cotización del conector de Lovyverse.</p></div>
 <div class="card"><span class="tag warn">Pendiente</span><p style="margin:8px 0 0">Hacer la prueba de aceptación con la Gerencia, ahora que los 34 casos técnicos están aprobados.</p></div>
 <div class="card"><span class="tag warn">Pendiente</span><p style="margin:8px 0 0">Recuperar el cronograma: SPI 0,86 al 03/11 contra un umbral de 0,95. Faltan la API, la base en el VPS y los ambientes.</p></div></div>
 <div class="row"><button class="btn" type="button" data-go="inicio">Volver al índice</button></div></div></div>`}
ALL.forEach((s,i)=>{const el=document.createElement("section");el.className="slide";el.id="s-"+s.id;el.setAttribute("aria-label",s.name||s.id);stage.appendChild(el);s.el=el;
 const b=document.createElement("button");b.type="button";b.setAttribute("aria-label",s.name||(s.id==="inicio"?"Índice":"Conexiones"));b.title=b.getAttribute("aria-label");b.onclick=()=>go(i);dots.appendChild(b);s.dot=b});
function render(i){const s=ALL[i];if(s.done)return;s.done=true;
 if(s.id==="portada")s.el.innerHTML=portada();else if(s.id==="inicio")s.el.innerHTML=cover();else if(s.id==="conexiones")s.el.innerHTML=conexiones();
 else s.el.innerHTML=`<div class="wrap" style="grid-template-columns:minmax(0,1fr)"><div class="body">
  <div class="dhead"><span class="kick">${s.phase} · ${s.n==="—"?"":"Entregable "+s.n+" · "}${s.name}</span><span class="file">${s.file}</span></div>
  <h2>${s.title}</h2>
  <div class="two"><div class="card"><div class="lab">Qué es</div><p style="margin:4px 0 0">${s.what}</p></div><div class="card hl"><div class="lab">Qué le sirve a Tu Churrito</div><p style="margin:4px 0 0">${s.value}</p></div></div>
  ${s.body()}</div></div>`;
 s.el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(ALL.findIndex(x=>x.id===b.dataset.go)))}
function go(i){i=Math.max(0,Math.min(ALL.length-1,i));const dir=i>=cur?"fwd":"back";cur=i;ALL.forEach((s,k)=>{s.el.classList.toggle("on",k===i);if(k===i)s.dot.setAttribute("aria-current","true");else s.dot.removeAttribute("aria-current")});
 render(i);anim(ALL[i].el,dir);$("#prog").style.width=((i+1)/ALL.length*100)+"%";ALL[i].el.scrollTop=0;$("#prev").disabled=i===0;$("#next").disabled=i===ALL.length-1;try{history.replaceState(null,"","#"+ALL[i].id)}catch(e){}}
$("#prev").onclick=()=>go(cur-1);$("#next").onclick=()=>go(cur+1);$("#home").onclick=()=>go(0);
document.addEventListener("keydown",e=>{if(e.target.matches("input"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(cur+1);else if(e.key==="ArrowLeft"||e.key==="PageUp")go(cur-1);else if(e.key==="Home")go(0);else if(e.key==="End")go(ALL.length-1)});
window.addEventListener("hashchange",()=>{const k=ALL.findIndex(s=>s.id===location.hash.slice(1));if(k>=0&&k!==cur)go(k)});
let tid=null,left=1200;const T=$("#timer");const paint=()=>{T.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")+(tid?" ■":" ▶");T.classList.toggle("run",!!tid)};
T.onclick=()=>{if(tid){clearInterval(tid);tid=null}else{if(left<=0)left=1200;tid=setInterval(()=>{left=Math.max(0,left-1);if(!left){clearInterval(tid);tid=null}paint()},1000)}paint()};paint();

const st=ALL.findIndex(s=>s.id===location.hash.slice(1));go(st>=0?st:0);
</script>
